[project]
name = "tegracli"
version = "0.3.0"
description = "A research-focused Telegram CLI application"
authors = [
	{ name = "Philipp Kessling", email = "p.kessling@leibniz-hbi.de" },
	{ name = "Felix Münch", email = "f.muench@lebniz-hbi.de"}
]
readme  = "README.md"
license = "MIT"
repository  = "https://github.com/Leibniz-HBI/tegracli"
homepage = "https://pypi.org/project/tegracli/"
classifiers = [
		"Development Status :: 3 - Alpha",
		"Environment :: Console",
		"Intended Audience :: Science/Research",
]
requires-python = ">=3.9,<4"
dependencies = [
	"Telethon",
	"ujson",
	"click",
	"loguru",
	"PyYAML",
	"pandas (>=2.2.3); python_version >= '3.13'",
]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
black = "*"
isort = "*"
pytest-cov = "*"
coverage = "*"
pydocstyle = "*"
pylint = "*"
pre-commit = "*"

[tool.pytest.ini_options]
addopts = "--cov-report html:tests/coverage --cov=tegracli --capture=sys"
asyncio_mode = "strict"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
tegracli = 'tegracli.main:cli'

[tool.isort]
profile = "black"
